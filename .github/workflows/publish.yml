name: Publish release

on:
  workflow_dispatch:
    inputs:
      tag_ref:
        description: 'Tag ref to publish release for'
        required: true
        type: string

jobs:
  create-release:
    runs-on: ubuntu-latest
    
    steps:
      - name: Git Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set GitHub Actions as commit author
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Needs the full history from fetch-depth: 0; with a shallow clone git
      # can't find the merge base and fails with "unrelated histories".
      - name: Merge release tag into main
        run: |
          git fetch --all --tags
          git merge --no-edit ${{ inputs.tag_ref }}
          git push origin main

      - name: Checkout release tag
        run: git checkout ${{ inputs.tag_ref }}

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
       
      - name: Build with Maven
        run: mvn -B package --file pom.xml

      - name: Get version
        run: |
          VERSION=$( mvn help:evaluate -Dexpression=project.version -q -DforceStdout )
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        id: get_version
       
      - name: Upload release to GitHub Releases
        uses: softprops/action-gh-release@v2
        with: 
          tag_name: v${{ steps.get_version.outputs.version }}
          name: v${{ steps.get_version.outputs.version }}
          body: "**Changes:**"
          files: ./target/*-${{ steps.get_version.outputs.version }}.jar

      - name: Trigger javadoc workflow
        uses: actions/github-script@v8
        with:
          script: |
            github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'javadoc.yml',
              ref: 'main',
            })
